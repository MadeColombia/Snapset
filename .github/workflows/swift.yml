name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Pick an iPhone simulator
      # Runner images change their simulator list, so take whichever iPhone is installed.
      run: echo "SIM_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')" >> "$GITHUB_ENV"
    - name: Build and test
      run: >
        xcodebuild test
        -project Snapset.xcodeproj -scheme Snapset
        -destination "platform=iOS Simulator,id=$SIM_ID"
        CODE_SIGNING_ALLOWED=NO
